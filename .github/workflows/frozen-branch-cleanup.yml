name: RepoRelay frozen branch cleanup

on:
  workflow_dispatch:
    inputs:
      repository_alias:
        description: Allowlisted RepoRelay target alias
        required: true
        type: string
      pr_number:
        description: Pull request whose same-repository head branch must be deleted
        required: true
        type: string
      mode:
        description: Required pull-request terminal state
        required: true
        type: choice
        options:
          - merged
          - closed_unmerged

permissions:
  contents: read

concurrency:
  group: frozen-branch-cleanup-${{ inputs.repository_alias }}-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.actor == 'alescim17'
    runs-on: ubuntu-latest
    steps:
      - name: Create RepoRelay installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.REPORELAY_APP_CLIENT_ID }}
          private-key: ${{ secrets.REPORELAY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: read

      - name: Delete frozen terminal PR branch
        env:
          REPORELAY_TARGET_TOKEN: ${{ steps.app-token.outputs.token }}
          REPORELAY_TARGETS_JSON: ${{ secrets.REPORELAY_TARGETS_JSON }}
          TARGET_ALIAS: ${{ inputs.repository_alias }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TERMINAL_MODE: ${{ inputs.mode }}
        run: |
          node <<'NODE'
          const token = process.env.REPORELAY_TARGET_TOKEN;
          const alias = process.env.TARGET_ALIAS;
          const prNumber = Number(process.env.PR_NUMBER);
          const mode = process.env.TERMINAL_MODE;

          const fail = (code, message) => {
            console.error(`::error title=${code}::${message}`);
            process.exit(1);
          };

          if (!token) fail('TOKEN_REQUIRED', 'RepoRelay installation token is missing');
          if (!/^target\/[A-Za-z0-9._-]+$/.test(alias || '')) {
            fail('TARGET_ALIAS_INVALID', 'Target alias is invalid');
          }
          if (!Number.isInteger(prNumber) || prNumber <= 0) {
            fail('PR_NUMBER_INVALID', 'PR number must be a positive integer');
          }
          if (!['merged', 'closed_unmerged'].includes(mode)) {
            fail('TERMINAL_MODE_INVALID', 'Unsupported cleanup mode');
          }

          let targets;
          try {
            targets = JSON.parse(process.env.REPORELAY_TARGETS_JSON || '');
          } catch {
            fail('TARGET_MAP_INVALID', 'RepoRelay target map is invalid JSON');
          }
          const repository = targets?.[alias];
          if (typeof repository !== 'string' || !/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository)) {
            fail('TARGET_ALIAS_UNMAPPED', 'Target alias is not mapped');
          }
          const [owner] = repository.split('/');

          const request = async (method, path, expected = [200]) => {
            const response = await fetch(`https://api.github.com${path}`, {
              method,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'RepoRelay-frozen-cleanup/1',
              },
            });
            const text = await response.text();
            let body = null;
            if (text) {
              try { body = JSON.parse(text); } catch { body = text; }
            }
            if (!expected.includes(response.status)) {
              fail('GITHUB_API_ERROR', `${method} ${path} returned HTTP ${response.status}`);
            }
            return { status: response.status, body };
          };

          const pull = (await request('GET', `/repos/${repository}/pulls/${prNumber}`)).body;
          if (pull?.head?.repo?.full_name !== repository) {
            fail('PR_HEAD_REPOSITORY_MISMATCH', 'PR head must belong to the target repository');
          }
          if (mode === 'merged' && pull?.merged !== true) {
            fail('PR_NOT_MERGED', 'PR is not merged');
          }
          if (mode === 'closed_unmerged' && !(pull?.state === 'closed' && pull?.merged !== true)) {
            fail('PR_NOT_CLOSED_UNMERGED', 'PR is not closed and unmerged');
          }

          const metadata = (await request('GET', `/repos/${repository}`)).body;
          const headRef = pull?.head?.ref;
          const headSha = pull?.head?.sha;
          if (typeof headRef !== 'string' || typeof headSha !== 'string') {
            fail('PR_HEAD_MISSING', 'PR head ref or SHA is missing');
          }
          if (headRef === metadata?.default_branch) {
            fail('DEFAULT_BRANCH_DELETE_FORBIDDEN', 'Refusing to delete the default branch');
          }

          const encodedBranch = headRef.split('/').map(encodeURIComponent).join('/');
          const branch = (await request('GET', `/repos/${repository}/branches/${encodedBranch}`)).body;
          if (branch?.commit?.sha !== headSha) {
            fail('BRANCH_HEAD_CHANGED', 'Branch no longer points to the terminal PR head SHA');
          }

          const query = new URLSearchParams({
            state: 'open',
            head: `${owner}:${headRef}`,
            per_page: '100',
          });
          const openPulls = (await request('GET', `/repos/${repository}/pulls?${query.toString()}`)).body;
          if (!Array.isArray(openPulls)) fail('OPEN_PR_QUERY_INVALID', 'Open PR query returned an invalid response');
          if (openPulls.length > 0) {
            fail('BRANCH_STILL_IN_USE', 'Another open pull request still uses this branch');
          }

          await request('DELETE', `/repos/${repository}/git/refs/heads/${encodedBranch}`, [204]);
          const verification = await request(
            'GET',
            `/repos/${repository}/branches/${encodedBranch}`,
            [404],
          );
          if (verification.status !== 404) {
            fail('BRANCH_DELETE_NOT_VERIFIED', 'Deleted branch is still readable');
          }

          console.log(JSON.stringify({
            completed: true,
            repository: alias,
            pr: prNumber,
            mode,
            deleted: true,
          }));
          NODE
